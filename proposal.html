    <style>
        /* ─── Proposal-only typography + layout ───────────────────────── */

        .prop-page {
            background: #fff;
            min-height: 100vh;
        }
        .prop-hero { background: var(--paper-cream, #f7f1e6); }
        .prop-hotel--cream { background: var(--paper-cream, #f7f1e6); }
        .prop-container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* HERO band */
        .prop-hero {
            padding: 96px 0 56px;
            text-align: center;
            border-bottom: 1px solid rgba(199, 174, 138, 0.32);
        }
        .prop-hero-kicker {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.34em;
            text-transform: uppercase;
            color: var(--gold);
            margin: 0 0 18px;
        }
        .prop-hero-title {
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: clamp(42px, 6vw, 64px);
            line-height: 1.05;
            color: var(--ink);
            margin: 0 0 22px;
            letter-spacing: -0.015em;
        }
        .prop-hero-title em { font-style: italic; font-weight: 300; color: var(--gold); }
        .prop-hero-lede {
            font-family: var(--font-serif);
            font-weight: 300;
            font-size: clamp(17px, 1.5vw, 19px);
            line-height: 1.6;
            color: rgba(30, 53, 82, 0.78);
            max-width: 640px;
            margin: 0 auto;
        }
        .prop-hero-dates {
            display: inline-block;
            margin-top: 22px;
            padding: 10px 22px;
            background: #fff;
            border: 1px solid rgba(199, 174, 138, 0.48);
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--ink);
        }
        .prop-hero-prepared {
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            color: var(--ink);
            margin: 0 0 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }
        .prop-hero-prepared-inner { white-space: nowrap; }
        .prop-hero-prepared::before,
        .prop-hero-prepared::after {
            content: "";
            width: 44px;
            height: 1px;
            background: rgba(199, 174, 138, 0.6);
        }
        .prop-hero-valid {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 300;
            font-size: 13px;
            color: rgba(30, 53, 82, 0.55);
            margin: 14px 0 0;
        }

        /* Discreet PDF button (bottom-right, hidden when printing) */
        .prop-pdf-btn {
            position: fixed;
            right: 22px;
            bottom: 22px;
            z-index: 60;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 20px;
            background: #fff;
            border: 1px solid rgba(199, 174, 138, 0.55);
            color: var(--ink);
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(30, 53, 82, 0.08);
            transition: background .25s ease, color .25s ease;
        }
        .prop-pdf-btn:hover { background: var(--ink); color: #f7f1e6; }

        /* HOTEL SECTIONS — split "lookbook" layout: full-bleed photo pinned
           on the left, content scrolling on the right. As one option scrolls
           away, the next option's photo takes over. */
        .prop-hotel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-bottom: none;
            padding: 0;
        }
        .prop-hotel-visual { position: relative; }
        .prop-hotel-visual-inner {
            position: sticky;
            top: 0;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        .prop-hotel-visual-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .prop-hotel-body {
            padding: 104px 64px 104px 64px;
            max-width: 620px;
            justify-self: start;
        }
        .prop-hotel + .prop-hotel .prop-hotel-body { border-top: 1px solid rgba(199, 174, 138, 0.0); }

        /* 3-photo click-through carousel in the content panel */
        .prop-carousel {
            position: relative;
            aspect-ratio: 3 / 2;
            overflow: hidden;
            background: var(--bone-warm, #efe7d6);
            border: 1px solid rgba(199, 174, 138, 0.32);
            margin: 0 0 26px;
        }
        .prop-carousel img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity .45s ease;
        }
        .prop-carousel img.is-active { opacity: 1; }
        .prop-carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 3;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: rgba(247, 241, 230, 0.92);
            color: var(--ink);
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 10px rgba(30, 53, 82, 0.18);
            transition: background .2s ease;
        }
        .prop-carousel-btn:hover { background: #fff; }
        .prop-carousel-btn.prev { left: 14px; }
        .prop-carousel-btn.next { right: 14px; }
        .prop-carousel-dots {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            z-index: 3;
            display: flex;
            justify-content: center;
            gap: 7px;
        }
        .prop-carousel-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(247, 241, 230, 0.55);
            transition: background .2s ease, transform .2s ease;
        }
        .prop-carousel-dots span.is-active { background: #f7f1e6; transform: scale(1.25); }
        .prop-carousel-count {
            position: absolute;
            top: 12px;
            right: 14px;
            z-index: 3;
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.08em;
            color: #f7f1e6;
            background: rgba(20, 33, 51, 0.55);
            padding: 4px 10px;
            border-radius: 999px;
        }

        .prop-hotel-num {
            font-family: var(--font-sans);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.34em;
            text-transform: uppercase;
            color: var(--gold);
            margin: 0 0 14px;
        }
        .prop-hotel-name {
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: clamp(32px, 4vw, 42px);
            line-height: 1.1;
            color: var(--ink);
            margin: 0 0 8px;
            letter-spacing: -0.012em;
        }
        .prop-hotel-name em { font-style: italic; font-weight: 300; color: var(--gold); }
        .prop-hotel-location {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 300;
            font-size: 16px;
            color: rgba(30, 53, 82, 0.62);
            margin: 0 0 24px;
        }
        .prop-hotel-room {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--ink);
            margin: 0 0 6px;
        }
        .prop-hotel-rate {
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: 28px;
            color: var(--ink);
            margin: 0 0 6px;
            letter-spacing: -0.005em;
        }
        .prop-hotel-rate em { font-style: italic; font-weight: 300; color: var(--gold); }
        .prop-hotel-rate-note {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 300;
            font-size: 13px;
            color: rgba(30, 53, 82, 0.55);
            margin: 0 0 28px;
        }
        .prop-hotel-flight {
            display: inline-flex;
            align-items: baseline;
            gap: 9px;
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.02em;
            color: rgba(30, 53, 82, 0.7);
            background: #fff;
            border: 1px solid rgba(199, 174, 138, 0.32);
            padding: 8px 14px;
            margin: 0 0 24px;
        }
        .prop-hotel-flight::before {
            content: "✈";
            color: var(--gold);
            font-size: 13px;
        }
        button.prop-hotel-flight {
            cursor: pointer;
            text-align: left;
            display: flex;
            width: 100%;
            align-items: center;
            gap: 10px;
            transition: background .2s ease, border-color .2s ease;
        }
        button.prop-hotel-flight:hover { background: #fdfaf4; border-color: var(--gold); }
        .prop-flight-open {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--gold);
            font-size: 10.5px;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .prop-flight-caret {
            font-size: 10px;
            transition: transform .2s ease;
            display: inline-block;
        }
        .prop-hotel-flightwrap.is-open .prop-flight-caret { transform: rotate(180deg); }
        .prop-hotel-flightwrap { margin: 0 0 24px; }
        .prop-hotel-flightwrap .prop-hotel-flight { margin-bottom: 0; }
        .prop-flight-details {
            border: 1px solid rgba(199, 174, 138, 0.32);
            border-top: none;
            background: rgba(255, 255, 255, 0.75);
            padding: 6px 18px 16px;
            font-family: var(--font-sans);
            font-size: 12.5px;
            font-weight: 400;
            line-height: 1.65;
            color: rgba(30, 53, 82, 0.78);
        }
        .prop-flight-details .pfd-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--gold);
            margin: 14px 0 3px;
        }
        .prop-flight-details .pfd-row { margin: 0; }
        .prop-flight-details .pfd-row strong { font-weight: 600; color: var(--ink); }
        .prop-hotel-desc {
            font-family: var(--font-serif);
            font-weight: 300;
            font-size: 17px;
            line-height: 1.7;
            color: rgba(30, 53, 82, 0.85);
            margin: 0 0 22px;
        }
        .prop-hotel-room-desc {
            font-family: var(--font-serif);
            font-weight: 300;
            font-size: 16px;
            line-height: 1.65;
            color: rgba(30, 53, 82, 0.75);
            margin: 0;
            padding-top: 22px;
            border-top: 1px solid rgba(199, 174, 138, 0.36);
        }
        .prop-hotel-room-desc strong {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--gold);
            display: block;
            margin-bottom: 8px;
        }

        /* Per-hotel preferred-partner amenities (renders when perksList set) */
        .prop-hotel-perks {
            margin: 22px 0 0;
            padding-top: 22px;
            border-top: 1px solid rgba(199, 174, 138, 0.36);
        }
        .prop-hotel-perks strong {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--gold);
            display: block;
            margin-bottom: 12px;
        }
        .prop-hotel-perks ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 8px;
        }
        .prop-hotel-perks li {
            font-family: var(--font-serif);
            font-weight: 300;
            font-size: 15px;
            line-height: 1.5;
            color: rgba(30, 53, 82, 0.8);
            padding-left: 24px;
            position: relative;
        }
        .prop-hotel-perks li::before {
            content: "✦";
            position: absolute;
            left: 0;
            top: 1px;
            color: var(--gold);
            font-size: 12px;
        }

        /* Per-hotel deposit & cancellation fine print */
        .prop-hotel-fineprint {
            margin: 22px 0 0;
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(199, 174, 138, 0.28);
            display: grid;
            gap: 10px;
        }
        .prop-hotel-fineprint p {
            font-family: var(--font-serif);
            font-weight: 300;
            font-size: 13.5px;
            line-height: 1.55;
            color: rgba(30, 53, 82, 0.7);
            margin: 0;
        }
        .prop-hotel-fineprint strong {
            font-family: var(--font-sans);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(30, 53, 82, 0.55);
            display: block;
            margin-bottom: 3px;
        }

        /* Photo-accuracy disclaimer (auto-rendered above the closing section) */
        .prop-photo-note {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 300;
            font-size: 13px;
            color: rgba(30, 53, 82, 0.5);
            text-align: center;
            max-width: 560px;
            margin: 0 auto;
            padding: 40px 24px 0;
        }

        /* Optional per-hotel self-book button (renders only when the hotel
           has a bookingUrl — Virtuoso / TravelWits). */
        .prop-hotel-cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 28px;
            padding: 13px 28px;
            background: var(--ink);
            color: #f7f1e6;
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-decoration: none;
            border: 1px solid var(--ink);
            transition: background .25s ease, color .25s ease;
        }
        .prop-hotel-cta:hover { background: transparent; color: var(--ink); }
        .prop-hotel-cta svg { transition: transform .25s ease; }
        .prop-hotel-cta:hover svg { transform: translateX(3px); }

        @media (max-width: 980px) {
            .prop-hotel { grid-template-columns: 1fr; }
            .prop-hotel-visual-inner {
                position: relative;
                height: 58vh;
                min-height: 340px;
            }
            .prop-hotel-visual-overlay { padding: 90px 24px 26px; }
            .prop-hotel-body {
                padding: 44px 24px 64px;
                max-width: none;
            }
            .prop-hero { padding: 64px 0 40px; }
        }

        /* Draft mode — click-to-edit affordances (Studio live preview only) */
        body.is-draft [data-edit] { cursor: text; }
        body.is-draft [data-edit]:hover {
            outline: 1.5px dashed rgba(199, 174, 138, 0.85);
            outline-offset: 3px;
        }
        body.is-draft [data-edit]:focus {
            outline: 1.5px solid var(--gold);
            outline-offset: 3px;
            background: rgba(255, 255, 255, 0.45);
        }

        /* PERKS STRIP — dark band emphasising Virtuoso inclusions */
        .prop-perks {
            background: var(--ink);
            color: #f3ede2;
            padding: 72px 0;
            margin-top: 0;
        }
        .prop-perks-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 56px;
            align-items: center;
        }
        .prop-perks-kicker {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.34em;
            text-transform: uppercase;
            color: rgba(214, 183, 135, 0.95);
            margin: 0 0 14px;
        }
        .prop-perks-title {
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: clamp(32px, 4vw, 44px);
            line-height: 1.1;
            color: #f7f1e6;
            margin: 0;
            letter-spacing: -0.012em;
        }
        .prop-perks-title em { font-style: italic; font-weight: 300; color: var(--gold-soft, #d6b787); }
        .prop-perks-intro {
            font-family: var(--font-serif);
            font-weight: 300;
            font-size: 16px;
            line-height: 1.6;
            color: rgba(243, 237, 226, 0.78);
            margin: 16px 0 0;
            max-width: 520px;
        }
        .prop-perks-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 14px;
        }
        .prop-perks-list li {
            font-family: var(--font-serif);
            font-weight: 300;
            font-size: 16px;
            line-height: 1.5;
            color: #f3ede2;
            padding-left: 28px;
            position: relative;
        }
        .prop-perks-list li::before {
            content: "✦";
            position: absolute;
            left: 0;
            top: 0;
            color: var(--gold-soft, #d6b787);
            font-size: 14px;
        }
        @media (max-width: 880px) {
            .prop-perks-grid { grid-template-columns: 1fr; gap: 32px; }
        }

        /* CLOSING */
        .prop-close {
            padding: 96px 0 120px;
            text-align: center;
        }
        .prop-close-title {
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: clamp(34px, 4.4vw, 48px);
            line-height: 1.15;
            color: var(--ink);
            margin: 0 0 22px;
        }
        .prop-close-title em { font-style: italic; font-weight: 300; color: var(--gold); }
        .prop-close-lede {
            font-family: var(--font-serif);
            font-weight: 300;
            font-size: 18px;
            line-height: 1.6;
            color: rgba(30, 53, 82, 0.78);
            max-width: 560px;
            margin: 0 auto 30px;
        }
        .prop-close-signature {
            margin-top: 24px;
        }
        .prop-close-signature-name {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 300;
            font-size: 28px;
            color: var(--ink);
            margin: 0;
        }
        .prop-close-signature-role {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(30, 53, 82, 0.55);
            margin: 6px 0 0;
        }
        /* Print / save-as-PDF — each hotel is exactly ONE page:
           short photo banner, identity block full-width, then the details
           flow in two tight columns. Carousel is hidden (the banner already
           shows the property). */
        @media print {
            @page { margin: 0.45in 0.5in; }
            .prop-pdf-btn, .site-header, .prop-carousel { display: none !important; }
            .prop-page, .prop-hero, .prop-hotel--cream { background: #fff; }

            /* Cover — vertically centered so the page reads as a deliberate title page */
            .prop-hero { padding: 0; border-bottom: none; min-height: 8.6in;
                display: flex; align-items: center; justify-content: center; }

            /* One page per hotel — explicit grid so nothing spills or gets clipped:
               photo top-left, identity beside it, flights full-width, then
               desc | room and amenities | fine print in fixed cells. */
            .prop-hotel { display: grid; grid-template-columns: 1fr 1fr;
                column-gap: 0.32in; grid-auto-rows: min-content; align-items: start;
                break-before: page; break-inside: avoid; }
            .prop-hotel-visual { grid-column: 1; grid-row: 1 / span 6; padding-right: 0; }
            .prop-hotel-visual-inner { position: static; height: 3in; }
            .prop-hotel-body { display: contents; }
            .prop-hotel-num { grid-column: 2; grid-row: 1; }
            .prop-hotel-name { grid-column: 2; grid-row: 2; }
            .prop-hotel-location { grid-column: 2; grid-row: 3; }
            .prop-hotel-room { grid-column: 2; grid-row: 4; }
            .prop-hotel-rate { grid-column: 2; grid-row: 5; }
            .prop-hotel-rate-note { grid-column: 2; grid-row: 6; }
            .prop-hotel-flightwrap, p.prop-hotel-flight { grid-column: 1 / -1; grid-row: 7; margin-top: 12px; }
            .prop-hotel-desc { grid-column: 1; grid-row: 8; margin-top: 12px; }
            .prop-hotel-room-desc { grid-column: 2; grid-row: 8; margin-top: 12px; }
            .prop-hotel-perks { grid-column: 1; grid-row: 9; }
            .prop-hotel-fineprint { grid-column: 2; grid-row: 9; }

            /* Compact type */
            .prop-hotel-num { margin-bottom: 6px; }
            .prop-hotel-name { font-size: 24px; margin-bottom: 4px; }
            .prop-hotel-location { font-size: 12px; margin-bottom: 12px; }
            .prop-hotel-room { font-size: 9.5px; margin-bottom: 4px; }
            .prop-hotel-rate { font-size: 18px; margin-bottom: 4px; }
            .prop-hotel-rate-note { font-size: 10px; margin-bottom: 10px; }
            .prop-hotel-flightwrap, p.prop-hotel-flight { margin-bottom: 10px; }
            button.prop-hotel-flight, p.prop-hotel-flight { font-size: 8.5px; padding: 4px 8px; }
            .prop-flight-open { display: none; }
            .prop-flight-details { padding: 2px 8px 6px; font-size: 8px; line-height: 1.45; }
            .prop-flight-details .pfd-label { font-size: 7px; margin: 6px 0 1px; }
            .prop-flight-details[hidden] { display: block !important; }
            .prop-hotel-desc { font-size: 10px; line-height: 1.5; margin-bottom: 10px; }
            .prop-hotel-room-desc { font-size: 9.5px; line-height: 1.5; padding-top: 10px; margin-bottom: 10px; }
            .prop-hotel-room-desc strong { font-size: 8px; margin-bottom: 4px; }
            .prop-hotel-perks { margin-top: 10px; padding-top: 10px; }
            .prop-hotel-perks strong { font-size: 8px; margin-bottom: 6px; }
            .prop-hotel-perks ul { gap: 3px; }
            .prop-hotel-perks li { font-size: 9.5px; line-height: 1.4; padding-left: 16px; }
            .prop-hotel-perks li::before { font-size: 9px; }
            .prop-hotel-fineprint { margin-top: 10px; padding: 8px 12px; gap: 6px; }
            .prop-hotel-fineprint p { font-size: 9px; line-height: 1.45; }
            .prop-hotel-fineprint strong { font-size: 7.5px; margin-bottom: 1px; }
            .prop-hotel-cta { display: none; }

            /* Closing gets its own tidy final page */
            .prop-photo-note { break-before: page; padding-top: 60px; }
            .prop-perks { -webkit-print-color-adjust: exact; print-color-adjust: exact; break-before: page; }
            .prop-close { padding: 30px 0 0; }
        }
    </style>

    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}

</head>
<body class="prop-page">

    <header class="site-header" id="siteHeader">
        <div class="container header-inner">
            <a href="/" class="brand" aria-label="Wander by Wilson — home">
                <span class="brand-wordmark">Wander by Wilson</span>
            </a>
        </div>
    </header>

    <main id="proposalRoot"></main>

    <script src="/data.js?v=91"></script>
    <script src="/proposals-data.js?v=91"></script>
    <script>
        /* ------------------------------------------------------------------
           Proposal bootstrap. Static proposals live in proposals-data.js
           (PROPOSALS); Studio-published ones are fetched from /api/proposals.
           Hotels optionally pull shared content from PROPERTIES (data.js).
             /proposals/{id}  or  /proposal.html?id={id}
           Unknown / missing id → redirect home.
           ?draft=1   → Studio live-preview mode (renders postMessage data)
           ?preview=1 → suppresses the first-open notification beacon
           ------------------------------------------------------------------ */
        (async function loadProposal() {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('id');
            if (!id) {
                const m = window.location.pathname.match(/^\/proposals\/([a-z0-9-]+)\/?$/);
                if (m) id = m[1];
            }
            const isDraft   = params.get('draft') === '1';
            const isPreview = params.get('preview') === '1';

            // Small helpers
            const decode = (s) => { const t = document.createElement('textarea'); t.innerHTML = s || ''; return t.value; };
            const strip  = (s) => (s || '').replace(/<[^>]+>/g, '');
            const lib    = (slug) => (typeof PROPERTIES !== 'undefined' && PROPERTIES[slug]) ? PROPERTIES[slug] : null;

            // ── Head / social meta ────────────────────────────────────────
            const setMeta = (sel, attr, val) => {
                let el = document.head.querySelector(sel);
                if (!el) {
                    el = document.createElement(sel.split('[')[0]);
                    const m = sel.match(/\[([^=]+)="([^"]+)"\]/);
                    if (m) el.setAttribute(m[1], m[2]);
                    document.head.appendChild(el);
                }
                el.setAttribute(attr, val);
            };
            function applyMeta(P) {
                const title   = P.metaTitle || (decode(strip(P.title)).replace(/\.$/, '') + ' — Wander by Wilson');
                const desc    = P.metaDescription || (P.lede ? strip(decode(P.lede)).slice(0, 160) : 'A private hotel proposal from Wander by Wilson.');
                const firstHero = P.hotels && P.hotels[0] ? (function (h) {
                    const base = h.slug ? lib(h.slug) : null;
                    const src = h.heroImage || (base && base.heroImage) || '';
                    return src ? new URL(src, window.location.origin).href : '';
                })(P.hotels[0]) : '';
                const ogImage = P.ogImage || firstHero || 'https://www.wanderbywilson.com/welcome-guide-images/og-card.jpg';
                document.title = title;
                setMeta('meta[name="description"]', 'content', desc);
                setMeta('meta[property="og:title"]', 'content', title);
                setMeta('meta[property="og:description"]', 'content', desc);
                setMeta('meta[property="og:image"]', 'content', ogImage);
            }

            // ── Resolve a hotel entry against the library (inline overrides win) ──
            function resolveHotel(h) {
                const base = h.slug ? lib(h.slug) : null;
                const libBooking = base && base.bookingUrl && base.bookingUrl !== '#' ? base.bookingUrl : '';
                return {
                    name:      h.name      || (base && base.name)        || '',
                    location:  h.location  || (base && base.location)    || '',
                    heroImage: h.heroImage || (base && base.heroImage)   || '',
                    desc:      h.desc      || (base && base.description) || '',
                    room:      h.room      || '',
                    rate:      h.rate      || (base && base.rateFrom ? 'From ' + base.rateFrom : ''),
                    rateNote:  h.rateNote  || '',
                    flight:    h.flight    || '',
                    flightDetails: h.flightDetails || '',
                    roomDescLabel: h.roomDescLabel || '',
                    roomDesc:  h.roomDesc  || '',
                    deposit:   h.deposit   || '',
                    cancellation: h.cancellation || '',
                    perksList: h.perksList || [],
                    perksLabel: h.perksLabel || 'Preferred-partner amenities &mdash; included',
                    gallery:   (h.gallery && h.gallery.length ? h.gallery : (base && base.gallery)) || [],
                    // undefined → inherit the library link; '' (set by the Studio) → no button
                    bookingUrl: h.bookingUrl !== undefined ? h.bookingUrl : libBooking
                };
            }

            const arrow = '<svg width="14" height="9" viewBox="0 0 14 9" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M0 4.5h13m0 0L9 1m4 3.5L9 8" stroke="currentColor" stroke-width="1" stroke-linecap="square"/></svg>';

            // Click-to-edit marker (Studio live preview only)
            const E = (path) => isDraft ? ` contenteditable="true" data-edit="${path}"` : '';

            // Flight details: plain multiline text → Google Flights-style rows.
            // Lines starting with Outbound / Return / Fares render as section
            // labels; everything else is a detail row. (Edit the text itself in
            // the Studio's "Flight details" box.)
            function flightDetailsHTML(text) {
                return String(text).split(/\n/).map(line => {
                    const t = line.trim();
                    if (!t) return '';
                    if (/^(outbound|return|fares?)\b/i.test(t.replace(/<[^>]+>/g, ''))) {
                        return `<p class="pfd-label">${t}</p>`;
                    }
                    return `<p class="pfd-row">${t}</p>`;
                }).join('');
            }

            // ── Section builders ──────────────────────────────────────────
            function hotelSection(h, i) {
                const r = resolveHotel(h);
                const altName = decode(strip(r.name));
                const num = 'No. ' + String(i + 1).padStart(2, '0');
                const shots = r.gallery || [];
                const carousel = shots.length
                    ? `<div class="prop-carousel">
                        ${shots.map((src, gi) => `<img src="${src}" alt="${altName} — view ${gi + 1}" loading="lazy" class="${gi === 0 ? 'is-active' : ''}">`).join('')}
                        <button class="prop-carousel-btn prev" type="button" aria-label="Previous photo">&#8592;</button>
                        <button class="prop-carousel-btn next" type="button" aria-label="Next photo">&#8594;</button>
                        <div class="prop-carousel-dots">${shots.map((_, gi) => `<span class="${gi === 0 ? 'is-active' : ''}"></span>`).join('')}</div>
                        ${shots.length > 1 ? `<span class="prop-carousel-count">1 / ${shots.length}</span>` : ''}
                       </div>`
                    : '';
                const roomDesc = r.roomDesc
                    ? `<p class="prop-hotel-room-desc">${r.roomDescLabel ? `<strong>${r.roomDescLabel}</strong>` : ''}<span${E(`hotels.${i}.roomDesc`)}>${r.roomDesc}</span></p>`
                    : '';
                const finePrint = (r.deposit || r.cancellation)
                    ? `<div class="prop-hotel-fineprint">
                        ${r.deposit ? `<p><strong>Deposit</strong><span${E(`hotels.${i}.deposit`)}>${r.deposit}</span></p>` : ''}
                        ${r.cancellation ? `<p><strong>Cancellation</strong><span${E(`hotels.${i}.cancellation`)}>${r.cancellation}</span></p>` : ''}
                       </div>`
                    : '';
                const hotelPerks = (r.perksList && r.perksList.length)
                    ? `<div class="prop-hotel-perks"><strong>${r.perksLabel}</strong><ul>` +
                      r.perksList.map(li => `<li>${li}</li>`).join('') +
                      '</ul></div>'
                    : '';
                const cta = r.bookingUrl
                    ? `<a class="prop-hotel-cta" href="${r.bookingUrl}" target="_blank" rel="noopener noreferrer">Book this rate ${arrow}</a>`
                    : '';
                return `
                <section class="prop-hotel${i % 2 ? ' prop-hotel--cream' : ''}">
                    <div class="prop-hotel-visual">
                        <div class="prop-hotel-visual-inner">
                            <img src="${r.heroImage}" alt="${altName} — ${decode(strip(r.location))}">
                        </div>
                    </div>
                    <div class="prop-hotel-body">
                        <p class="prop-hotel-num">${num}</p>
                        <h2 class="prop-hotel-name">${r.name}</h2>
                        <p class="prop-hotel-location">${r.location}</p>
                        ${r.room ? `<p class="prop-hotel-room"${E(`hotels.${i}.room`)}>${r.room}</p>` : ''}
                        ${r.rate ? `<p class="prop-hotel-rate"${E(`hotels.${i}.rate`)}>${r.rate}</p>` : ''}
                        ${r.rateNote ? `<p class="prop-hotel-rate-note"${E(`hotels.${i}.rateNote`)}>${r.rateNote}</p>` : ''}
                        ${r.flight ? (r.flightDetails
                            ? `<div class="prop-hotel-flightwrap">
                                <button class="prop-hotel-flight prop-flight-toggle" type="button" aria-expanded="false"><span${E(`hotels.${i}.flight`)}>${r.flight}</span><span class="prop-flight-open">Flight details <span class="prop-flight-caret">&#9662;</span></span></button>
                                <div class="prop-flight-details" hidden>${flightDetailsHTML(r.flightDetails)}</div>
                               </div>`
                            : `<p class="prop-hotel-flight"${E(`hotels.${i}.flight`)}>${r.flight}</p>`) : ''}
                        ${r.desc ? `<p class="prop-hotel-desc"${E(`hotels.${i}.desc`)}>${r.desc}</p>` : ''}
                        ${carousel}
                        ${roomDesc}
                        ${hotelPerks}
                        ${finePrint}
                        ${cta}
                    </div>
                </section>`;
            }

            function perksSection(p) {
                if (!p) return '';
                return `
                <section class="prop-perks">
                    <div class="prop-container">
                        <div class="prop-perks-grid">
                            <div>
                                <p class="prop-perks-kicker">${p.kicker || 'Included at every hotel'}</p>
                                <h2 class="prop-perks-title">${p.title || 'Wander by Wilson<br><em>exclusive perks.</em>'}</h2>
                                ${p.intro ? `<p class="prop-perks-intro">${p.intro}</p>` : ''}
                            </div>
                            <ul class="prop-perks-list" aria-label="Inclusions at every hotel">
                                ${(p.list || []).map(li => `<li>${li}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                </section>`;
            }

            function heroSection(P) {
                return `
                <section class="prop-hero">
                    <div class="prop-container">
                        ${P.kicker ? `<p class="prop-hero-kicker">${P.kicker}</p>` : ''}
                        ${P.preparedFor ? `<p class="prop-hero-prepared"><span class="prop-hero-prepared-inner">Prepared for <span${E('preparedFor')}>${P.preparedFor}</span></span></p>` : ''}
                        <h1 class="prop-hero-title"${E('title')}>${P.title || ''}</h1>
                        ${P.lede ? `<p class="prop-hero-lede"${E('lede')}>${P.lede}</p>` : ''}
                        ${P.dates ? `<p class="prop-hero-dates"${E('dates')}>${P.dates}</p>` : ''}
                        ${P.validUntil ? `<p class="prop-hero-valid">Rates valid until <span${E('validUntil')}>${P.validUntil}</span> &mdash; subject to availability thereafter.</p>` : ''}
                    </div>
                </section>`;
            }

            function closeSection(P) {
                return `
                <section class="prop-close">
                    <div class="prop-container">
                        <h2 class="prop-close-title"${E('closeTitle')}>${P.closeTitle || 'Just hit reply<br><em>to confirm.</em>'}</h2>
                        ${P.closeLede ? `<p class="prop-close-lede"${E('closeLede')}>${P.closeLede}</p>` : ''}
                        <div class="prop-close-signature">
                            <p class="prop-close-signature-name">${P.signatureName || 'Wilson'}</p>
                            <p class="prop-close-signature-role">${P.signatureRole || 'Founder &middot; Wander by Wilson'}</p>
                        </div>
                    </div>
                </section>`;
            }

            function initCarousels() {
                document.querySelectorAll('.prop-carousel').forEach(c => {
                    const imgs = [...c.querySelectorAll('img')];
                    if (imgs.length < 2) {
                        c.querySelectorAll('.prop-carousel-btn, .prop-carousel-dots').forEach(x => x.remove());
                        return;
                    }
                    const dots = [...c.querySelectorAll('.prop-carousel-dots span')];
                    const count = c.querySelector('.prop-carousel-count');
                    let i = 0;
                    const show = (n) => {
                        i = (n + imgs.length) % imgs.length;
                        imgs.forEach((im, k) => im.classList.toggle('is-active', k === i));
                        dots.forEach((d, k) => d.classList.toggle('is-active', k === i));
                        if (count) count.textContent = (i + 1) + ' / ' + imgs.length;
                    };
                    c.querySelector('.prev').addEventListener('click', () => show(i - 1));
                    c.querySelector('.next').addEventListener('click', () => show(i + 1));
                });
                document.querySelectorAll('.prop-flight-toggle').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const wrap = btn.closest('.prop-hotel-flightwrap');
                        const panel = wrap.querySelector('.prop-flight-details');
                        const open = panel.hasAttribute('hidden');
                        if (open) panel.removeAttribute('hidden'); else panel.setAttribute('hidden', '');
                        wrap.classList.toggle('is-open', open);
                        btn.setAttribute('aria-expanded', String(open));
                    });
                });
            }

            function render(P) {
                applyMeta(P);
                const photoNote = `<p class="prop-photo-note">${P.photoDisclaimer || 'Photography is provided by each property. Actual rooms may differ from the images shown.'}</p>`;
                document.getElementById('proposalRoot').innerHTML =
                    heroSection(P) +
                    (P.hotels || []).map(hotelSection).join('') +
                    perksSection(P.perks) +
                    photoNote +
                    closeSection(P);
                initCarousels();
                if (!document.querySelector('.prop-pdf-btn') && !isDraft) {
                    const btn = document.createElement('button');
                    btn.className = 'prop-pdf-btn';
                    btn.type = 'button';
                    btn.innerHTML = 'Save as PDF';
                    btn.addEventListener('click', () => window.print());
                    document.body.appendChild(btn);
                }
            }

            // ── Studio live-preview mode ──────────────────────────────────
            if (isDraft) {
                document.body.classList.add('is-draft');
                window.addEventListener('message', (e) => {
                    if (e.origin !== window.location.origin) return;
                    if (e.data && e.data.type === 'wndr-draft' && e.data.proposal) render(e.data.proposal);
                });
                // Click-to-edit: report edited text back to the Studio on blur.
                document.addEventListener('focusout', (ev) => {
                    const el = ev.target && ev.target.closest ? ev.target.closest('[data-edit]') : null;
                    if (!el) return;
                    const value = el.innerHTML
                        .replace(/<div><br\s*\/?><\/div>/gi, '<br>')
                        .replace(/<div>/gi, '<br>')
                        .replace(/<\/div>/gi, '')
                        .trim();
                    window.parent.postMessage({ type: 'wndr-edit', path: el.dataset.edit, value }, window.location.origin);
                });
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'wndr-draft-ready' }, window.location.origin);
                }
                return;
            }

            // ── Resolve the proposal: static file first, then the API ─────
            let P = (id && typeof PROPOSALS !== 'undefined') ? PROPOSALS[id] : null;
            let fromApi = false;
            if (!P && id && /^[a-z0-9-]+$/.test(id)) {
                try {
                    const res = await fetch('/api/proposals?id=' + encodeURIComponent(id));
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.proposal) { P = data.proposal; fromApi = true; }
                    }
                } catch (e) { /* fall through to redirect */ }
            }
            if (!P) { window.location.replace('/'); return; }

            render(P);

            // ── First-open notification beacon (Studio proposals only).
            //    Skipped for: team browsers (Studio sets wndr-team), ?preview=1
            //    links, and repeat opens within the same browser session.
            let isTeam = false;
            try { isTeam = localStorage.getItem('wndr-team') === '1' || !!sessionStorage.getItem('wndr-viewed-' + id); } catch (e) {}
            if (fromApi && !isPreview && !isTeam) {
                try { sessionStorage.setItem('wndr-viewed-' + id, '1'); } catch (e) {}
                fetch('/api/proposal-viewed', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                }).catch(() => {});
            }
        })();

        // Keep the Wander by Wilson logo header visible at all times on proposals
        // (the solid "scrolled" treatment from styles.css, applied permanently).
        document.getElementById('siteHeader').classList.add('is-scrolled');
    </script>
</body>
