<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>A Private Proposal · Wander by Wilson</title>
    <meta name="description" content="A private hotel proposal from Wander by Wilson.">

    <!-- Open Graph (in case the link is shared) — filled per-proposal by JS -->
    <meta property="og:title"        content="A Private Proposal · Wander by Wilson">
    <meta property="og:description"  content="A private hotel proposal from Wander by Wilson.">
    <meta property="og:image"        content="https://www.wanderbywilson.com/welcome-guide-images/og-card.jpg">
    <meta property="og:type"         content="website">
    <meta property="og:site_name"    content="Wander by Wilson">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css?v=270">

    <style>
        /* ─── Proposal-only typography + layout ───────────────────────── */

        .prop-page {
            background: #fff;
            min-height: 100vh;
        }
        /* The brand bar is solid ivory on proposal pages, so it reads the same
           over a cream title block or a full-bleed destination photo. */
        .prop-page .site-header.is-scrolled {
            background: var(--ivory); backdrop-filter: none; -webkit-backdrop-filter: none;
            border-bottom: 1px solid rgba(195, 162, 106, 0.45);
        }
        .prop-hero { background: var(--ivory); }
        .prop-hotel--cream { background: var(--ivory); }
        .prop-container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* HERO band */
        .prop-hero {
            padding: 96px 0 56px;
            text-align: center;
            border-bottom: 1px solid rgba(195, 162, 106, 0.32);
        }
        .prop-hero-kicker {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.34em;
            text-transform: uppercase;
            color: var(--gold);
            margin: 0 0 18px;
        }
        .prop-hero-title {
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: clamp(42px, 6vw, 64px);
            line-height: 1.05;
            color: var(--ink);
            margin: 0 0 22px;
            letter-spacing: -0.015em;
        }
        .prop-hero-title em { font-style: italic; font-weight: 300; color: var(--gold); }
        .prop-hero-lede {
            font-family: var(--font-serif);
            font-weight: 300;
            font-size: clamp(17px, 1.5vw, 19px);
            line-height: 1.6;
            color: rgba(30, 53, 82, 0.78);
            max-width: 640px;
            margin: 0 auto;
        }
        .prop-hero-dates {
            display: inline-block;
            margin-top: 22px;
            padding: 10px 22px;
            background: #fff;
            border: 1px solid rgba(195, 162, 106, 0.48);
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--ink);
        }
        .prop-hero-prepared {
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            color: var(--ink);
            margin: 0 0 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }
        .prop-hero-prepared-inner { white-space: nowrap; }
        .prop-hero-prepared::before,
        .prop-hero-prepared::after {
            content: "";
            width: 44px;
            height: 1px;
            background: rgba(195, 162, 106, 0.6);
        }
        .prop-hero-valid {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 300;
            font-size: 13px;
            color: rgba(30, 53, 82, 0.55);
            margin: 14px 0 0;
        }

        /* Discreet PDF button (bottom-right, hidden when printing) */
        .prop-pdf-btn {
            position: fixed;
            right: 22px;
            bottom: 22px;
            z-index: 60;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 20px;
            background: #fff;
            border: 1px solid rgba(195, 162, 106, 0.55);
            color: var(--ink);
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(30, 53, 82, 0.08);
            transition: background .25s ease, color .25s ease;
        }
        .prop-pdf-btn:hover { background: var(--ink); color: var(--ivory); }

        /* "Also considered" — a quiet record of what was looked at */
        .prop-considered { padding: 56px 0 8px; background: #fff; }
        .prop-considered-head {
            font-family: var(--font-sans); font-size: 11px; font-weight: 500;
            letter-spacing: 0.28em; text-transform: uppercase;
            color: rgba(30, 53, 82, 0.42); margin: 0 0 22px; text-align: center;
        }
        .prop-considered-list {
            list-style: none; margin: 0 auto; padding: 0; max-width: 900px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 22px;
        }
        .prop-considered-list li { text-align: center; opacity: 0.55; transition: opacity .3s ease; }
        .prop-considered-list li:hover { opacity: 0.9; }
        .prop-considered-list img {
            width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block;
            filter: grayscale(1); margin-bottom: 10px;
        }
        .prop-considered-list li:hover img { filter: grayscale(0.4); }
        .prop-considered-name {
            display: block; font-family: var(--font-serif); font-size: 15px; color: var(--ink);
        }
        .prop-considered-loc, .prop-considered-why {
            display: block; font-family: var(--font-sans); font-size: 11px;
            color: rgba(30, 53, 82, 0.5); margin-top: 3px; line-height: 1.5;
        }
        .prop-considered-why { font-style: italic; }

        /* How to get there — lookbook only */
        .prop-hotel-getting {
            border-top: 1px solid rgba(195, 162, 106, 0.35);
            padding-top: 28px; margin: 28px 0 0;
            font-family: var(--font-sans); font-size: 14px; line-height: 1.65;
            color: rgba(30, 53, 82, 0.78);
        }
        .prop-hotel-getting strong {
            display: block; font-size: 11px; font-weight: 500; letter-spacing: 0.2em;
            text-transform: uppercase; color: var(--gold); margin-bottom: 8px;
        }

        /* Average temperatures — lookbook only. Twelve months at a glance, so a
           client can sanity-check the window they had in mind and, just as
           usefully, spot a better one. The travelling month is highlighted. */
        .prop-hotel-climate {
            margin: 28px 0 0; padding-top: 28px;
            border-top: 1px solid rgba(195, 162, 106, 0.36);
        }
        .prop-hotel-climate strong {
            display: block; font-family: var(--font-sans); font-size: 11px;
            font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase;
            color: var(--gold); margin-bottom: 12px;
        }
        .prop-climate-strip { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 2px; }
        .prop-climate-month {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            padding: 8px 2px; text-align: center;
            background: rgba(195, 162, 106, 0.09);
            font-family: var(--font-sans);
        }
        .prop-climate-month.is-on { background: var(--gold); }
        .pcm-m {
            font-size: 9px; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap;
            color: rgba(30, 53, 82, 0.55);
        }
        .pcm-hi { font-size: 13px; color: rgba(30, 53, 82, 0.9); }
        .pcm-lo { font-size: 11px; color: rgba(30, 53, 82, 0.5); }
        .prop-climate-month.is-on .pcm-m  { color: rgba(255, 251, 240, 0.85); }
        .prop-climate-month.is-on .pcm-hi { color: #fffbf0; }
        .prop-climate-month.is-on .pcm-lo { color: rgba(255, 251, 240, 0.78); }
        .prop-climate-note {
            margin: 10px 0 0; font-family: var(--font-sans); font-size: 11px;
            line-height: 1.55; color: rgba(30, 53, 82, 0.5);
        }
        /* Twelve columns stop being readable well before the mobile stack. */
        @media (max-width: 760px) {
            .prop-climate-strip { grid-template-columns: repeat(6, minmax(0, 1fr)); }
        }

        /* Where to stay — a horizontal rail of bookable properties in the city.
           Deliberately a scroller rather than a grid: it signals "a sample, not
           a shortlist", and keeps a destination page from turning into a quote. */
        .prop-hotel-stays {
            margin: 28px 0 0; padding-top: 28px;
            border-top: 1px solid rgba(195, 162, 106, 0.36);
        }
        .prop-hotel-stays > strong, .prop-stays-head > strong {
            display: block; font-family: var(--font-sans); font-size: 11px;
            font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase;
            color: var(--gold); margin-bottom: 12px;
        }
        .prop-stays-rail {
            display: grid; grid-auto-flow: column; grid-auto-columns: 190px;
            gap: 14px; overflow-x: auto; overscroll-behavior-x: contain;
            scroll-snap-type: x proximity; padding-bottom: 10px;
            scrollbar-width: thin; scrollbar-color: rgba(195,162,106,.55) transparent;
        }
        .prop-stays-rail::-webkit-scrollbar { height: 4px; }
        .prop-stays-rail::-webkit-scrollbar-thumb { background: rgba(195,162,106,.55); }
        .prop-stay { scroll-snap-align: start; text-decoration: none; display: block; color: inherit; }
        .prop-stay.is-text { align-self: start; border-top: 2px solid var(--gold); padding-top: 12px; }
        .prop-stays-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
        .prop-stays-head > strong { margin-bottom: 0 !important; }
        .prop-stays-arrows { display: flex; gap: 8px; }
        .prop-stays-btn {
            width: 40px; height: 40px; border-radius: 0; cursor: pointer;
            border: 1px solid rgba(30, 53, 82, 0.45); background: transparent; color: var(--gold);
            font-family: var(--font-sans); font-size: 15px; line-height: 1;
            transition: background .45s var(--ease-soft), border-color .45s var(--ease-soft), color .45s var(--ease-soft), opacity .2s ease;
        }
        .prop-stays-btn:hover { background: rgba(30, 53, 82, 0.04); border-color: var(--ink); color: var(--ink); }
        .prop-stays-btn:disabled { opacity: .3; cursor: default; }
        .prop-stays-arrows[hidden] { display: none; }
        .prop-stay-shot {
            aspect-ratio: 3 / 2; overflow: hidden; background: var(--bone-warm, #efe7d6);
            border: 1px solid rgba(195, 162, 106, 0.32); margin-bottom: 9px;
            display: flex; align-items: center; justify-content: center;
        }
        .prop-stay-shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
        /* No photo yet: a deliberate monogram rather than a broken frame. */
        .prop-stay-shot.is-empty span {
            font-family: var(--font-serif); font-size: 34px; font-weight: 300;
            color: rgba(195, 162, 106, 0.75); line-height: 1;
        }
        .prop-stay-name {
            margin: 0 0 3px; font-family: var(--font-serif); font-weight: 400;
            font-size: 15px; line-height: 1.3; color: rgba(30, 53, 82, 0.92);
            /* Two lines' worth, so a wrapped name doesn't push its neighbourhood
               out of line with the cards either side of it. */
            min-height: 2.6em;
        }
        a.prop-stay:hover .prop-stay-name { color: var(--gold); }
        .prop-stay-note {
            margin: 0; font-family: var(--font-sans); font-size: 10.5px;
            letter-spacing: 0.04em; line-height: 1.45; color: rgba(30, 53, 82, 0.5);
        }
        .prop-stays-note {
            margin: 12px 0 0; font-family: var(--font-sans); font-size: 11px;
            line-height: 1.55; color: rgba(30, 53, 82, 0.5);
        }

        /* HOTEL SECTIONS — split "lookbook" layout: full-bleed photo pinned
           on the left, content scrolling on the right. As one option scrolls
           away, the next option's photo takes over. */
        .prop-hotel {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            border-bottom: none;
            padding: 0;
        }
        .prop-hotel-visual { position: relative; }
        .prop-hotel-visual-inner {
            position: sticky;
            top: 0;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        .prop-hotel-visual-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .prop-hotel-body {
            padding: 104px 64px 104px 64px;
            /* Centre the column in its half rather than pinning it left, so a
               wide window grows the margins on both sides instead of stranding
               all the space on the right. Box-sizing keeps the padding inside
               the cap, so the measure stays a comfortable ~620px. */
            max-width: 748px;
            box-sizing: border-box;
            justify-self: center;
            width: 100%;
        }
        .prop-hotel + .prop-hotel .prop-hotel-body { border-top: 1px solid rgba(195, 162, 106, 0.0); }

        /* 3-photo click-through carousel in the content panel */
        .prop-carousel {
            position: relative;
            aspect-ratio: 3 / 2;
            overflow: hidden;
            background: var(--bone-warm, #efe7d6);
            border: 1px solid rgba(195, 162, 106, 0.32);
            margin: 0 0 26px;
        }
        .prop-carousel img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity .45s ease;
        }
        .prop-carousel img.is-active { opacity: 1; }
        .prop-carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 3;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: rgba(247, 241, 230, 0.92);
            color: var(--ink);
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 10px rgba(30, 53, 82, 0.18);
            transition: background .2s ease;
        }
        .prop-carousel-btn:hover { background: #fff; }
        .prop-carousel-btn.prev { left: 14px; }
        .prop-carousel-btn.next { right: 14px; }
        .prop-carousel-dots {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            z-index: 3;
            display: flex;
            justify-content: center;
            gap: 7px;
        }
        .prop-carousel-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(247, 241, 230, 0.55);
            transition: background .2s ease, transform .2s ease;
        }
        .prop-carousel-dots span.is-active { background: var(--ivory); transform: scale(1.25); }
        .prop-carousel-count {
            position: absolute;
            top: 12px;
            right: 14px;
            z-index: 3;
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.08em;
            color: var(--ivory);
            background: rgba(20, 33, 51, 0.55);
            padding: 4px 10px;
            border-radius: 999px;
        }

        .prop-hotel-num {
            font-family: var(--font-sans);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.34em;
            text-transform: uppercase;
            color: var(--gold);
            margin: 0 0 14px;
        }
        .prop-hotel-name {
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: clamp(32px, 4vw, 42px);
            line-height: 1.1;
            color: var(--ink);
            margin: 0 0 8px;
            letter-spacing: -0.012em;
        }
        .prop-hotel-name em { font-style: italic; font-weight: 300; color: var(--gold); }
        .prop-hotel-location {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 300;
            font-size: 16px;
            color: rgba(30, 53, 82, 0.62);
            margin: 0 0 24px;
        }
        .prop-hotel-room {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--ink);
            margin: 0 0 6px;
        }
        .prop-hotel-rate {
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: 28px;
            color: var(--ink);
            margin: 0 0 6px;
            letter-spacing: -0.005em;
        }
        .prop-hotel-rate em { font-style: italic; font-weight: 300; color: var(--gold); }
        .prop-hotel-rate-note {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 300;
            font-size: 13px;
            color: rgba(30, 53, 82, 0.55);
            margin: 0 0 28px;
        }
        .prop-hotel-flight {
            display: inline-flex;
            align-items: baseline;
            gap: 9px;
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.02em;
            color: rgba(30, 53, 82, 0.7);
            background: #fff;
            border: 1px solid rgba(195, 162, 106, 0.32);
            padding: 8px 14px;
            margin: 0 0 24px;
        }
        .prop-hotel-flight::before {
            content: "✈";
            color: var(--gold);
            font-size: 13px;
        }
        button.prop-hotel-flight {
            cursor: pointer;
            text-align: left;
            display: flex;
            width: 100%;
            align-items: center;
            gap: 10px;
            transition: background .2s ease, border-color .2s ease;
        }
        button.prop-hotel-flight:hover { background: #fdfaf4; border-color: var(--gold); }
        .prop-flight-open {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--gold);
            font-size: 10.5px;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .prop-flight-caret {
            font-size: 10px;
            transition: transform .2s ease;
            display: inline-block;
        }
        .prop-hotel-flightwrap.is-open .prop-flight-caret { transform: rotate(180deg); }
        .prop-hotel-flightwrap { margin: 0 0 24px; }
        .prop-hotel-flightwrap .prop-hotel-flight { margin-bottom: 0; }
        .prop-flight-note { font-size: 11px; font-style: italic; opacity: .7; margin: -8px 0 18px; }
        .prop-flight-details {
            border: 1px solid rgba(195, 162, 106, 0.32);
            border-top: none;
            background: rgba(255, 255, 255, 0.75);
            padding: 6px 18px 16px;
            font-family: var(--font-sans);
            font-size: 12.5px;
            font-weight: 400;
            line-height: 1.65;
            color: rgba(30, 53, 82, 0.78);
        }
        .prop-flight-details .pfd-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--gold);
            margin: 14px 0 3px;
        }
        .prop-flight-details .pfd-row { margin: 0; }
        .prop-flight-details .pfd-row strong { font-weight: 600; color: var(--ink); }
        .prop-hotel-desc {
            font-family: var(--font-serif);
            font-weight: 300;
            font-size: 17px;
            line-height: 1.7;
            color: rgba(30, 53, 82, 0.85);
            margin: 0 0 22px;
        }
        .prop-hotel-room-desc {
            font-family: var(--font-serif);
            font-weight: 300;
            font-size: 16px;
            line-height: 1.65;
            color: rgba(30, 53, 82, 0.75);
            margin: 0;
            padding-top: 22px;
            border-top: 1px solid rgba(195, 162, 106, 0.36);
        }
        .prop-hotel-room-desc strong {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--gold);
            display: block;
            margin-bottom: 8px;
        }

        /* Per-hotel preferred-partner amenities (renders when perksList set) */
        .prop-hotel-perks {
            margin: 28px 0 0;
            padding-top: 28px;
            border-top: 1px solid rgba(195, 162, 106, 0.36);
        }
        .prop-hotel-perks strong {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--gold);
            display: block;
            margin-bottom: 12px;
        }
        .prop-hotel-perks ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 8px;
        }
        .prop-hotel-perks li {
            font-family: var(--font-serif);
            font-weight: 300;
            font-size: 15px;
            line-height: 1.5;
            color: rgba(30, 53, 82, 0.8);
            padding-left: 24px;
            position: relative;
        }
        .prop-hotel-perks li::before {
            content: "✦";
            position: absolute;
            left: 0;
            top: 1px;
            color: var(--gold);
            font-size: 12px;
        }

        /* Per-hotel deposit & cancellation fine print */
        .prop-hotel-fineprint {
            margin: 22px 0 0;
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(195, 162, 106, 0.28);
            display: grid;
            gap: 10px;
        }
        .prop-hotel-fineprint p {
            font-family: var(--font-serif);
            font-weight: 300;
            font-size: 13.5px;
            line-height: 1.55;
            color: rgba(30, 53, 82, 0.7);
            margin: 0;
        }
        .prop-hotel-fineprint strong {
            font-family: var(--font-sans);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(30, 53, 82, 0.55);
            display: block;
            margin-bottom: 3px;
        }

        /* Rates by room category — the full negotiated rate sheet, so each
           couple in a group can pick their own category off one page. */
        .prop-hotel-rates {
            margin: 22px 0 0;
            padding-top: 22px;
            border-top: 1px solid rgba(195, 162, 106, 0.36);
        }
        .prop-hotel-rates > strong {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.28em;
            text-transform: uppercase;

    <script>
        /* ------------------------------------------------------------------
           Proposal bootstrap. Static proposals live in proposals-data.js
           (PROPOSALS); Studio-published ones are fetched from /api/proposals.
           Hotels optionally pull shared content from PROPERTIES (data.js).
             /proposals/{id}  or  /proposal.html?id={id}
           Unknown / missing id → redirect home.
           ?draft=1   → Studio live-preview mode (renders postMessage data)
           ?preview=1 → suppresses the first-open notification beacon
           ------------------------------------------------------------------ */
        (async function loadProposal() {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('id');
            if (!id) {
                const m = window.location.pathname.match(/^\/proposals\/([a-z0-9-]+)\/?$/);
                if (m) id = m[1];
            }
            const isDraft   = params.get('draft') === '1';
            const isPreview = params.get('preview') === '1';

            // Small helpers
            const decode = (s) => { const t = document.createElement('textarea'); t.innerHTML = s || ''; return t.value; };
            const strip  = (s) => (s || '').replace(/<[^>]+>/g, '');
            const lib    = (slug) => (typeof PROPERTIES !== 'undefined' && PROPERTIES[slug]) ? PROPERTIES[slug] : null;

            // ── Head / social meta ────────────────────────────────────────
            const setMeta = (sel, attr, val) => {
                let el = document.head.querySelector(sel);
                if (!el) {
                    el = document.createElement(sel.split('[')[0]);
                    const m = sel.match(/\[([^=]+)="([^"]+)"\]/);
                    if (m) el.setAttribute(m[1], m[2]);
                    document.head.appendChild(el);
                }
                el.setAttribute(attr, val);
            };
            function applyMeta(P) {
                const title   = P.metaTitle || (decode(strip(P.title)).replace(/\.$/, '') + ' · Wander by Wilson');
                const desc    = P.metaDescription || (P.lede ? strip(decode(P.lede)).slice(0, 160) : 'A private hotel proposal from Wander by Wilson.');
                const firstHero = P.hotels && P.hotels[0] ? (function (h) {
                    const base = h.slug ? lib(h.slug) : null;
                    const src = h.heroImage || (base && base.heroImage) || '';
                    return src ? new URL(src, window.location.origin).href : '';
                })(P.hotels[0]) : '';
                const ogImage = P.ogImage || firstHero || 'https://www.wanderbywilson.com/welcome-guide-images/og-card.jpg';
                document.title = title;
                setMeta('meta[name="description"]', 'content', desc);
                setMeta('meta[property="og:title"]', 'content', title);
                setMeta('meta[property="og:description"]', 'content', desc);
                setMeta('meta[property="og:image"]', 'content', ogImage);
            }

            // ── Resolve a hotel entry against the library (inline overrides win) ──
            const WELCOME_NOTE = new RegExp(((window.WBW_RULES || {}).checks || {}).welcomeNote || 'welcome[^,.;]{0,40}(note|letter)', 'i');
            // Gallery without the hero and without repeats.
            function dedupeShots(hero, list) {
                const seen = new Set([String(hero || '').toLowerCase()]);
                return (list || []).filter(u => {
                    const k = String(u || '').toLowerCase();
                    if (!k || seen.has(k)) return false;
                    seen.add(k); return true;
                });
            }
            function resolveHotel(h) {
                const base = h.slug ? lib(h.slug) : null;
                const libBooking = base && base.bookingUrl && base.bookingUrl !== '#' ? base.bookingUrl : '';
                return {
                    name:      h.name      || (base && base.name)        || '',
                    location:  h.location  || (base && base.location)    || '',
                    heroImage: h.heroImage || (base && base.heroImage)   || '',
                    desc:      h.desc      || (base && base.description) || '',
                    room:      h.room      || '',
                    // Never the library's "From" rate: a proposal only prints a rate
                    // that came from a real quote for these dates.
                    rate:      h.rate      || '',
                    rateNote:  h.rateNote  || '',
                    flight:    h.flight    || '',
                    flightDetails: h.flightDetails || '',
                    roomDescLabel: h.roomDescLabel || '',
                    roomDesc:  h.roomDesc  || '',
                    deposit:   h.deposit   || '',
                    cancellation: h.cancellation || '',
                    gettingThere: h.gettingThere || '',
                    climate:   h.climate   || null,
                    stays:     h.stays     || null,
                    considered: !!h.considered,
                    consideredWhy: h.consideredWhy || '',
                    // The advisor's welcome note is a surprise: never printed.
                    perksList: (h.perksList || []).filter(p => !WELCOME_NOTE.test(strip(String(p)))),
                    // Same name as the hotel pages (Wilson, 2026-10-03); older proposals saved the old default.
                    perksLabel: (!h.perksLabel || /^your preferred[- ]partner amenities$/i.test(h.perksLabel.trim())) ? 'Wander by Wilson Exclusives' : h.perksLabel,
                    // Rates by room category — for group quotes where every couple
                    // picks their own category off one negotiated rate sheet.
                    rateTable: h.rateTable || [],
                    rateTableLabel: h.rateTableLabel || 'Rates by room category',
                    rateTableNote: h.rateTableNote || '',
                    terms: h.terms || [],
                    termsLabel: h.termsLabel || 'Good to know',
                    gallery:   dedupeShots(h.heroImage || (base && base.heroImage) || '',
                                   (h.gallery && h.gallery.length ? h.gallery : (base && base.gallery)) || []),
                    // undefined → inherit the library link; '' (set by the Studio) → no button
                    bookingUrl: h.bookingUrl !== undefined ? h.bookingUrl : libBooking

            }

            /* A proposal saved as a draft is work in progress — anyone who
               reaches the link before it's published sees a holding note, not a
               half-finished shortlist. The team (?preview=1) always sees it. */
            function isHeldBack(P) {
                if (!P || P.status !== 'draft') return false;
                const q = new URLSearchParams(window.location.search);
                if (q.get('preview') === '1') return false;
                try { if (localStorage.getItem('wndr-team') === '1') return false; } catch (e) {}
                return true;
            }

            const arrow = '<svg width="14" height="9" viewBox="0 0 14 9" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M0 4.5h13m0 0L9 1m4 3.5L9 8" stroke="currentColor" stroke-width="1" stroke-linecap="square"/></svg>';

            // Lines starting with Outbound / Return / Fares render as section

            function flightDetailsHTML(text) {
                return String(text).split(/\n/).map(line => {
                    const t = line.trim();
                    if (!t) return '';
                    if (/^(outbound|return|fares?)\b/i.test(t.replace(/<[^>]+>/g, ''))) {

            }

            // Where-to-stay rails: arrows scroll one card at a time and hide when
            // everything already fits.
            function initStayRails() {
                document.querySelectorAll('.prop-hotel-stays, .prop-todo').forEach(box => {
                    const rail = box.querySelector('.prop-stays-rail');
                    const arrows = box.querySelector('.prop-stays-arrows');
                    if (!rail || !arrows) return;
                    const [prev, next] = arrows.querySelectorAll('.prop-stays-btn');
                    const update = () => {
                        const more = rail.scrollWidth > rail.clientWidth + 4;
                        arrows.hidden = !more;
                        prev.disabled = rail.scrollLeft <= 2;
                        next.disabled = rail.scrollLeft + rail.clientWidth >= rail.scrollWidth - 2;
                    };

                        const card = rail.querySelector('.prop-stay');

                        rail.scrollBy({ left: step * (+b.dataset.dir), behavior: 'smooth' });

                    rail.addEventListener('scroll', update, { passive: true });
                    window.addEventListener('resize', update);
                    update();
                    rail.querySelectorAll('img').forEach(img => img.addEventListener('load', update));

            }

            // ── Section builders ──────────────────────────────────────────
            // Twelve-month temperature strip: average high/low per month. It
            // shows what the weather does all year, so a client can judge any
            // window themselves (no "best time to go" claim, Wilson 2026-10-03).
            function climateHTML(c, guide) {
                if (!(c && c.months && c.months.length)) return '';
                // Destination guides: no note under the strip (Wilson, 2026-10-03);
                // the unit goes in the heading, the station stays in sourceNotes.
                const label = guide ? 'Average temperatures (&deg;F)' : (c.label || 'Average temperatures');
                return `<div class="prop-hotel-climate">
                        <strong>${label}</strong>
                        <div class="prop-climate-strip">${c.months.map(m =>
                            `<div class="prop-climate-month${(c.highlight || []).indexOf(m.m) > -1 ? ' is-on' : ''}">` +
                            `<span class="pcm-m">${m.m}</span>` +
                            `<span class="pcm-hi">${m.hi}&deg;</span>` +
                            `<span class="pcm-lo">${m.lo}&deg;</span></div>`).join('')}</div>
                        ${(!guide && c.note) ? `<p class="prop-climate-note">${c.note}</p>` : ''}
                       </div>`;
            }
            // Where to stay: a rail of properties we can book there. Library
            // hotels (slug) link to their page and use its photo.
            // Match a "where to stay" hotel to its page on our site by name, so a
            // hotel that gets a page later picks up its photo and link by itself.
            const normHotel = (x) => decode(strip(String(x || ''))).toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9 ]/g, ' ')
                .replace(/\b(the|a|an|hotel|resort|resorts|and|residences|collection|luxury|by|auberge)\b/g, ' ')
                .replace(/\s+/g, ' ').trim();
            function libSlugByName(name) {
                if (typeof PROPERTIES === 'undefined') return '';
                const n = normHotel(name);
                if (!n) return '';
                return Object.keys(PROPERTIES).find(k => normHotel(PROPERTIES[k].name) === n) || '';
            }
            function staysHTML(st) {
                if (!(st && st.items && st.items.length)) return '';
                return `<div class="prop-hotel-stays">
                        <div class="prop-stays-head"><strong>${st.label || 'Where to stay'}</strong>
                            <span class="prop-stays-arrows">
                                <button class="prop-stays-btn" data-dir="-1" type="button" aria-label="Previous hotels">&#8592;</button>
                                <button class="prop-stays-btn" data-dir="1" type="button" aria-label="More hotels">&#8594;</button>
                            </span></div>
                        <div class="prop-stays-rail">${st.items.map(it => {
                            const slug = (it.slug && lib(it.slug)) ? it.slug : libSlugByName(it.name);
                            const base = slug ? lib(slug) : null;
                            const name = it.name || (base && base.name) || '';
                            const img = it.image || (base && base.heroImage) || '';

                            const nm = decode(strip(name));

                                ? `<div class="prop-stay-shot"><img src="${img}" alt="${nm}"></div>` : '';
                            const inner = `${shot}<p class="prop-stay-name">${name}</p>` +
                                          (it.note ? `<p class="prop-stay-note">${it.note}</p>` : '');
                            const cls = 'prop-stay' + (img ? '' : ' is-text');
                            return url
                                ? `<a class="${cls}" href="${url}" target="_blank" rel="noopener">${inner}</a>`
                                : `<div class="${cls}">${inner}</div>`;

            }
            // A destination guide: the place itself, before (or instead of) hotels.
            // A guide's cover is an iconic landmark (heroImage). If none is set,
            // use the guide's first photo, then a featured hotel's as a last resort.
            function destCover(d) {
                if (d.heroImage) return d.heroImage;
                if ((d.gallery || [])[0]) return d.gallery[0];
                for (const it of ((d.stays || {}).items || [])) {
                    const slug = (it.slug && lib(it.slug)) ? it.slug : libSlugByName(it.name);
                    const img = it.image || (slug && lib(slug) ? lib(slug).heroImage : '');

            }
            if (!P) { window.location.replace('/'); return; }

            render(P);

            // ── First-open notification beacon (Studio proposals only).
            //    Skipped for: team browsers (Studio sets wndr-team), ?preview=1
            //    links, and repeat opens within the same browser session.
            let isTeam = false;
            try {
                // A preview visit marks this browser as team so later opens of
                // the clean link (e.g. printing to PDF) never count as a view.
                if (isPreview) localStorage.setItem('wndr-team', '1');
                isTeam = localStorage.getItem('wndr-team') === '1' || !!sessionStorage.getItem('wndr-viewed-' + id);
            } catch (e) {}
            if (fromApi && !isPreview && !isTeam) {
                try { sessionStorage.setItem('wndr-viewed-' + id, '1'); } catch (e) {}
                fetch('/api/proposal-viewed', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                }).catch(() => {});
            }
        })();

        // Keep the Wander by Wilson logo header visible at all times on proposals
        // (the solid "scrolled" treatment from styles.css, applied permanently).
        document.getElementById('siteHeader').classList.add('is-scrolled');
    </script>
</body>
</html>
